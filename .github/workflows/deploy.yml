# On every push (or merged pull request) to main: run the tests, back up the live
# database, deploy to Azure App Service and check the site answers. Pull requests to
# main only run the tests.
#
# Azure login uses OpenID Connect (no stored password). It needs these repository
# secrets (Settings > Secrets and variables > Actions), see README "Automatic deploy":
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # Azure OIDC login
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}  # one deploy at a time
  cancel-in-progress: false

env:
  RESOURCE_GROUP: padelscore-rg
  APP_NAME: padelscore-sorrycion
  KUDU: https://padelscore-sorrycion.scm.azurewebsites.net
  SITE: https://padelscore-sorrycion.azurewebsites.net

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Back up the live database
        run: |
          token=$(az account get-access-token --resource https://management.azure.com/ --query accessToken -o tsv)
          echo "::add-mask::$token"
          backup="/home/data/padelscore-backup-$(date -u +%Y%m%d-%H%M%S)-gh.db"
          result=$(curl -sf -X POST -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            "$KUDU/api/command" -d "{\"command\":\"cp -p /home/data/padelscore.db $backup\",\"dir\":\"/home\"}")
          echo "$result"
          test "$(echo "$result" | jq .ExitCode)" = 0
          echo "Backed up to $backup"

      # The SQL files of sql/predeployment that haven't run on the live database yet
      # (app/migrate.py, standard library only) run before the new code goes live.
      # The changes are additive, so the version still running keeps working.
      - name: Run pre-deployment SQL on the live database
        run: |
          token=$(az account get-access-token --resource https://management.azure.com/ --query accessToken -o tsv)
          echo "::add-mask::$token"
          dir="padelscore-predeploy-${{ github.run_id }}"
          cleanup() { curl -s -o /dev/null -X DELETE -H "Authorization: Bearer $token" -H "If-Match: *" \
                        "$KUDU/api/vfs/$dir/?recursive=true" || true; }
          trap cleanup EXIT
          for f in app/__init__.py app/db.py app/migrate.py sql/predeployment/*.sql; do
            curl -sf -X PUT -H "Authorization: Bearer $token" -H "If-Match: *" \
              --data-binary @"$f" "$KUDU/api/vfs/$dir/$f" > /dev/null
          done
          kudu() {  # run one command (no shell) in the uploaded folder; fail on a non-zero exit
            result=$(curl -sf --max-time 300 -X POST -H "Authorization: Bearer $token" \
              -H "Content-Type: application/json" "$KUDU/api/command" \
              -d "$(jq -n --arg c "$1" --arg d "/home/$dir" '{command: $c, dir: $d}')")
            echo "$result" | jq -r '.Output, .Error'
            test "$(echo "$result" | jq .ExitCode)" = 0
          }
          kudu "env PADELSCORE_DB=/home/data/padelscore.db python3 -m app.migrate --status"
          kudu "env PADELSCORE_DB=/home/data/padelscore.db python3 -m app.migrate"

      - name: Deploy
        run: |
          git archive --format=zip -o deploy.zip HEAD
          token=$(az account get-access-token --resource https://management.azure.com/ --query accessToken -o tsv)
          echo "::add-mask::$token"
          curl -sf --max-time 900 -X POST -H "Authorization: Bearer $token" \
            --data-binary @deploy.zip "$KUDU/api/zipdeploy"
          # Without a restart the old version keeps running.
          az webapp restart -g "$RESOURCE_GROUP" -n "$APP_NAME" -o none

      - name: Check the site answers
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$SITE/enter" || true)
            echo "try $i: $code"
            [ "$code" = 200 ] && exit 0
            sleep 15
          done
          exit 1
