# Every hour from 9:00 to 17:00 (Mexico): ask the live app to email today's game-day
# reminders, then the recaps of the last days' jornadas (POST /tasks/send-emails), a few
# per run: Azure's free domain allows 10 emails an hour. See docs/processes/EMAIL.md. Azure App Service F1 can't run
# scheduled jobs, so GitHub calls it. The app checks the X-Task-Token header against its
# TASKS_TOKEN app setting; the same value is the repository secret TASKS_TOKEN.
name: Daily emails

on:
  schedule:
    - cron: "0 15-23 * * *"   # 15:00-23:00 UTC = 9:00-17:00 in Mexico City (UTC-6 all year)
  workflow_dispatch:       # "Run workflow" by hand, e.g. to try it

permissions: {}

jobs:
  recaps:
    runs-on: ubuntu-latest
    steps:
      - name: Send the due reminders and recaps (a few per run)
        env:
          TASKS_TOKEN: ${{ secrets.TASKS_TOKEN }}
          SITE: https://padelscore-sorrycion.azurewebsites.net
        run: |
          if [ -z "$TASKS_TOKEN" ]; then
            echo "::notice::The TASKS_TOKEN secret isn't set: email is off (docs/processes/EMAIL.md)"
            exit 0
          fi
          # F1 sleeps when idle: the first request may take a while to wake it.
          curl -fsS --max-time 200 --retry 2 --retry-delay 20 -X POST \
            -H "X-Task-Token: $TASKS_TOKEN" "$SITE/tasks/send-emails"
          echo
