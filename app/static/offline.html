<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6aa5ff">
  <title>Sin conexión · PadelScore</title>
  <style>
    :root { --bg: #f1f2f6; --card: #fff; --text: #141b2d; --muted: #6b7280; --accent: #4568f5; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #10131a; --card: #1b2030; --text: #e8ebf3; --muted: #9aa3b5; --accent: #7d97ff; }
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           box-sizing: border-box; background: var(--bg); color: var(--text);
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { background: var(--card); border-radius: 16px; padding: 28px 24px; max-width: 360px;
           text-align: center; box-shadow: 0 4px 14px rgba(20, 27, 45, .08); }
    h1 { font-size: 1.4rem; margin: 12px 0 6px; }
    p { color: var(--muted); margin: 0 0 18px; }
    a { display: inline-block; background: var(--accent); color: #fff; text-decoration: none;
        font-weight: 600; padding: 10px 20px; border-radius: 999px; }
  </style>
</head>
<body>
  <main>
    <svg width="72" height="72" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#6aa5ff"/><stop offset="1" stop-color="#4568f5"/>
        </linearGradient>
        <radialGradient id="ball" cx="40%" cy="35%" r="70%">
          <stop offset="0" stop-color="#f4ff9a"/><stop offset="1" stop-color="#c6e33a"/>
        </radialGradient>
      </defs>
      <rect width="512" height="512" rx="112" fill="url(#bg)"/>
      <circle cx="256" cy="256" r="170" fill="url(#ball)"/>
      <path d="M98 191 C 214 222, 214 290, 98 321"
            fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round"/>
      <path d="M414 191 C 298 222, 298 290, 414 321"
            fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round"/>
    </svg>
    <h1>Sin conexión</h1>
    <p>PadelScore necesita internet para mostrar resultados al día. / You're offline.</p>
    <a href="/">Reintentar · Retry</a>
  </main>
</body>
</html>
