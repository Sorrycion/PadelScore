{% extends "base.html" %}
{% block title %}{{ _("login") }} · PadelScore{% endblock %}
{% block content %}
<h1>{{ _("login_title") }}</h1>
<p class="muted">{{ _("login_hint") }}</p>
{% if error %}<p class="error">{{ _(error) }}</p>{% endif %}
<form method="post" action="/login" class="inline">
  <input type="hidden" name="next" value="{{ next }}">
  <input type="password" name="password" placeholder="{{ _('club_password') }}" autocomplete="current-password" required autofocus>
  <button type="submit">{{ _("login") }}</button>
</form>
{% endblock %}
