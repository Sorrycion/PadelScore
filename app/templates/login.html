{% extends "base.html" %}
{% block title %}{{ _("login") }} · PadelScore{% endblock %}
{% block content %}
<h1>{{ _("login_title") }}</h1>
<p class="muted">{{ _("login_hint") }}</p>
{% if error %}<p class="error">{{ _(error) }}</p>{% endif %}
<form method="post" action="/login" class="stack card">
  <input type="hidden" name="next" value="{{ next }}">
  <label>{{ _("username") }}
    <input name="username" value="{{ username or '' }}" autocomplete="username" autocapitalize="off">
  </label>
  <label>{{ _("password") }}
    <input type="password" name="password" autocomplete="current-password" required>
  </label>
  <button type="submit">{{ _("login") }}</button>
</form>
{% endblock %}
